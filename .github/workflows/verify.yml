name: Verify mathematics package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned mathematical dependencies
        run: python -m pip install -r requirements.txt
      - name: Check exported integrity and bounded mathematics
        run: python scripts/verify.py
